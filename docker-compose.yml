services:
  stackvia:
    build: .
    container_name: stackvia
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - ./data:/app/data
      # Read-only still exposes powerful host control. Prefer a socket proxy in production.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
